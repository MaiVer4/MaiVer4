<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 325" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18" />
      <stop offset="50%" stop-color="#0a1424" />
      <stop offset="100%" stop-color="#060b13" />
    </linearGradient>

    <radialGradient id="termGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .code-font {
      font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, Monaco, Consolas, "Courier New", monospace;
      font-size: 13.2px;
    }
    .gutter-font {
      font-family: ui-monospace, SFMono-Regular, "Fira Code", monospace;
      font-size: 12px;
      fill: #334155;
      text-anchor: end;
    }
    .header-font {
      font-family: ui-monospace, SFMono-Regular, "Fira Code", monospace;
      font-size: 11.5px;
    }
  </style>

  <!-- Terminal Window Surface (Border-radius 10px) -->
  <rect x="2" y="2" width="936" height="321" rx="10" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.5" />
  <rect x="2" y="2" width="936" height="321" rx="10" fill="url(#termGlow)" />

  <!-- Terminal Title Bar -->
  <path d="M 2 12 Q 2 2 12 2 L 928 2 Q 938 2 938 12 L 938 38 L 2 38 Z" fill="#0b172a" />
  <line x1="2" y1="38" x2="938" y2="38" stroke="#1e293b" stroke-width="1" />

  <!-- macOS / Linux Window Controls -->
  <circle cx="22" cy="20" r="5.5" fill="#ef4444" />
  <circle cx="40" cy="20" r="5.5" fill="#f59e0b" />
  <circle cx="58" cy="20" r="5.5" fill="#10b981" />

  <!-- Active File Tab -->
  <rect x="80" y="8" width="138" height="24" rx="4" fill="#070d18" stroke="#1e293b" stroke-width="1" />
  <circle cx="94" cy="20" r="3" fill="#64ffda" />
  <text x="106" y="24" class="header-font" fill="#e2e8f0" font-weight="600">developer.yml</text>

  <!-- Right Metadata -->
  <text x="918" y="24" class="header-font" fill="#475569" text-anchor="end">UTF-8 // YAML // ADSO</text>

  <!-- Gutter Line -->
  <line x1="48" y1="46" x2="48" y2="315" stroke="#1e293b" stroke-width="1" />

  <!-- Line Numbers -->
  <g class="gutter-font">
    <text x="40" y="68">1</text>
    <text x="40" y="94">2</text>
    <text x="40" y="120">3</text>
    <text x="40" y="146">4</text>
    <text x="40" y="172">5</text>
    <text x="40" y="198">6</text>
    <text x="40" y="224">7</text>
    <text x="40" y="250">8</text>
    <text x="40" y="276">9</text>
    <text x="40" y="302">10</text>
  </g>

  <!-- Code Content -->
  <g class="code-font">
    <!-- Line 1: developer: -->
    <text x="64" y="68" fill="#64ffda" font-weight="700">developer:</text>

    <!-- Line 2: name: Maicol Vera -->
    <text x="64" y="94">
      <tspan fill="#64ffda">  name:</tspan> <tspan fill="#ffffff" font-weight="700">Maicol Vera</tspan>
    </text>

    <!-- Line 3: role: Full Stack & Backend Developer -->
    <text x="64" y="120">
      <tspan fill="#64ffda">  role:</tspan> <tspan fill="#e2e8f0">Full Stack &amp; Backend Developer</tspan>
    </text>

    <!-- Line 4: education: Technologist in Software Analysis and Development (ADSO) - SENA -->
    <text x="64" y="146">
      <tspan fill="#64ffda">  education:</tspan> <tspan fill="#cbd5e1">Technologist in Software Analysis and Development (ADSO) - </tspan><tspan fill="#c084fc" font-weight="700">SENA</tspan>
    </text>

    <!-- Line 5: status: Available for SENA Internship / Junior Opportunities -->
    <text x="64" y="172">
      <tspan fill="#64ffda">  status:</tspan> <tspan fill="#34d399" font-weight="600">● Available for SENA Internship / Junior Opportunities</tspan>
    </text>

    <!-- Line 6: focus: -->
    <text x="64" y="198" fill="#64ffda">  focus:</text>

    <!-- Line 7: focus bullet 1 -->
    <text x="64" y="224">
      <tspan fill="#38bdf8">    -</tspan> <tspan fill="#e2e8f0">Robust RESTful APIs &amp; Layered Architecture with </tspan><tspan fill="#6DB33F" font-weight="700">Java 21 &amp; Spring Boot</tspan>
    </text>

    <!-- Line 8: focus bullet 2 -->
    <text x="64" y="250">
      <tspan fill="#38bdf8">    -</tspan> <tspan fill="#e2e8f0">Dynamic, Reactive SPAs with </tspan><tspan fill="#DD0031" font-weight="700">Angular (17-21)</tspan><tspan fill="#e2e8f0"> &amp; Modern React</tspan>
    </text>

    <!-- Line 9: focus bullet 3 -->
    <text x="64" y="276">
      <tspan fill="#38bdf8">    -</tspan> <tspan fill="#e2e8f0">Intelligent Contextual Retrieval with </tspan><tspan fill="#c084fc" font-weight="700">RAG Pipelines &amp; Vector DBs (ChromaDB)</tspan>
    </text>

    <!-- Line 10: approach: ... -->
    <text x="64" y="302">
      <tspan fill="#64ffda">  approach:</tspan> <tspan fill="#38bdf8" font-style="italic">"Methodical debugging, test-driven mindset &amp; clean maintainable code"</tspan>
    </text>
  </g>
</svg>
