<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 120" width="100%" height="100%">
  <defs>
    <!-- Deep Minimalist Canvas Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b14" />
      <stop offset="50%" stop-color="#08101e" />
      <stop offset="100%" stop-color="#060b14" />
    </linearGradient>

    <!-- Title Crisp Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Subtle Hairline Base Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060b14" stop-opacity="0" />
      <stop offset="25%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#64ffda" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#060b14" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Clean Canvas Surface -->
  <rect width="940" height="120" fill="url(#bg)" />

  <!-- Centered Minimalist Typography -->
  <text x="470" y="58" text-anchor="middle" fill="url(#titleGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', Ubuntu, Cantarell, sans-serif" font-size="38" font-weight="500" letter-spacing="-0.3">Maicol Vera</text>
  
  <text x="470" y="88" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', Ubuntu, Cantarell, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" letter-spacing="2">FULL STACK &amp; BACKEND <tspan fill="#475569">•</tspan> <tspan fill="#38bdf8">JR. ADVANCED PENTESTER</tspan> <tspan fill="#475569">•</tspan> <tspan fill="#64ffda">ADSO SENA</tspan></text>

  <!-- Elegant 1px Minimalist Bottom Hairline -->
  <line x1="100" y1="119" x2="840" y2="119" stroke="url(#lineGrad)" stroke-width="1" />
</svg>
