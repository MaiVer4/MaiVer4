<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b14" />
      <stop offset="60%" stop-color="#0a1526" />
      <stop offset="100%" stop-color="#060b14" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b172b" />
      <stop offset="50%" stop-color="#0f2744" />
      <stop offset="100%" stop-color="#0b172b" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e2a4a" />
      <stop offset="40%" stop-color="#155e75" />
      <stop offset="100%" stop-color="#0e2a4a" />
    </linearGradient>

    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="50%" stop-color="#64ffda" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Glow Filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #ffffff;
      letter-spacing: 2px;
      text-anchor: middle;
    }
    .desc-text {
      font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      font-size: 15.5px;
      fill: #64ffda;
      letter-spacing: 2.5px;
      text-anchor: middle;
    }
    .tech-marker {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 10px;
      fill: #475569;
    }
  </style>

  <!-- Base Canvas Surface -->
  <rect width="940" height="220" fill="url(#bg)" />
  <rect width="940" height="220" fill="url(#centerGlow)" />

  <!-- Subtle Corner Tech Coordinates -->
  <text x="24" y="24" class="tech-marker">+ 00.1</text>
  <text x="906" y="24" class="tech-marker">MV-46 +</text>

  <!-- Multi-Layered Cyber Waving Form (Bottom) -->
  <!-- Wave Layer 1 (Deep background) -->
  <path d="M 0 160 C 180 135, 340 185, 520 165 C 700 145, 820 175, 940 155 L 940 220 L 0 220 Z" fill="url(#waveGrad1)" opacity="0.8" />

  <!-- Wave Layer 2 (Mid cyan-blue blend) -->
  <path d="M 0 180 C 150 150, 360 205, 540 175 C 720 145, 850 185, 940 170 L 940 220 L 0 220 Z" fill="url(#waveGrad2)" opacity="0.6" />

  <!-- Wave Layer 3 (Foreground Glowing Crest) -->
  <path d="M 0 198 C 160 172, 320 215, 510 190 C 690 165, 830 195, 940 182 L 940 220 L 0 220 Z" fill="url(#waveGrad3)" opacity="0.4" />
  
  <!-- Glowing Crest Highlight Line -->
  <path d="M 0 198 C 160 172, 320 215, 510 190 C 690 165, 830 195, 940 182" fill="none" stroke="url(#waveGrad3)" stroke-width="2" filter="url(#glow)" />

  <!-- Centered Hero Typography -->
  <text x="470" y="86" class="title-text" filter="url(#glow)">Maicol Vera</text>
  <text x="470" y="124" class="desc-text">FULL STACK &amp; BACKEND DEVELOPER | ADSO SENA</text>
</svg>
