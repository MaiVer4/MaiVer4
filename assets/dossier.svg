<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dossierBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b14" />
      <stop offset="50%" stop-color="#0b172a" />
      <stop offset="100%" stop-color="#050a12" />
    </linearGradient>

    <!-- Progress Bar Gradients -->
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#64ffda" />
    </linearGradient>
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="dossierGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0" />
    </radialGradient>

    <pattern id="dossierGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#64ffda" stroke-opacity="0.035" stroke-width="1" />
    </pattern>

    <filter id="neonBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, Monaco, Consolas, monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>

  <!-- Outer Card Surface (Outer radius 16px) -->
  <rect x="2" y="2" width="936" height="326" rx="16" fill="url(#dossierBg)" stroke="#1e293b" stroke-width="1.5" />
  <rect x="2" y="2" width="936" height="326" rx="16" fill="url(#dossierGrid)" />
  <rect x="2" y="2" width="936" height="326" rx="16" fill="url(#dossierGlow)" />

  <!-- Inner Frame (Inset 6px, radius 10px: r_outer 16 = r_inner 10 + 6) -->
  <rect x="8" y="8" width="924" height="314" rx="10" fill="none" stroke="#64ffda" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="6 4" />

  <!-- Tech Corner Markers -->
  <path d="M 6 22 L 6 6 L 22 6" fill="none" stroke="#64ffda" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 934 22 L 934 6 L 918 6" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 6 308 L 6 324 L 22 324" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 934 308 L 934 324 L 918 324" fill="none" stroke="#64ffda" stroke-width="2.5" stroke-linecap="round" />

  <!-- ================= TOP HEADER BAR ================= -->
  <g class="mono">
    <circle cx="28" cy="30" r="3.5" fill="#64ffda" filter="url(#neonBlur)" />
    <text x="40" y="34" fill="#64ffda" font-size="11.5" font-weight="700" letter-spacing="2">OPERATIVE DOSSIER</text>
    <text x="210" y="34" fill="#475569" font-size="11">//</text>
    <text x="226" y="34" fill="#94a3b8" font-size="11" letter-spacing="1">AGENT PROTOCOL: <tspan fill="#e2e8f0" font-weight="600">FULL STACK SPECIALIST</tspan></text>
    
    <rect x="740" y="18" width="168" height="24" rx="4" fill="#0c192d" stroke="#1e293b" stroke-width="1" />
    <text x="824" y="34" fill="#38bdf8" font-size="10.5" font-weight="600" text-anchor="middle" letter-spacing="1">CLEARANCE: SENA LEVEL 4</text>
  </g>

  <!-- Top Divider Line -->
  <line x1="24" y1="50" x2="916" y2="50" stroke="#1e293b" stroke-width="1" />
  <line x1="24" y1="50" x2="160" y2="50" stroke="#64ffda" stroke-width="1.5" stroke-opacity="0.8" />
  <circle cx="160" cy="50" r="2" fill="#64ffda" />

  <!-- ================= LEFT COLUMN: IDENTITY MATRIX ================= -->
  <g class="mono">
    <text x="36" y="80" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="2">⚡ IDENTITY MATRIX</text>
    
    <!-- Spec Row 1 -->
    <text x="36" y="112" fill="#64748b" font-size="11" font-weight="600">CODENAME:</text>
    <text x="145" y="112" fill="#ffffff" font-size="11.5" font-weight="700">Maicol Vera <tspan fill="#64ffda">[@MaiVer4]</tspan></text>

    <!-- Spec Row 2 -->
    <text x="36" y="140" fill="#64748b" font-size="11" font-weight="600">SPECIALTY:</text>
    <text x="145" y="140" fill="#e2e8f0" font-size="11.5" font-weight="600">Java 21 Microservices &amp; Angular SPAs</text>

    <!-- Spec Row 3 -->
    <text x="36" y="168" fill="#64748b" font-size="11" font-weight="600">BASE / GEO:</text>
    <text x="145" y="168" fill="#e2e8f0" font-size="11.5" font-weight="600">Armenia, Quindío, Colombia 🇨🇴</text>

    <!-- Spec Row 4 -->
    <text x="36" y="196" fill="#64748b" font-size="11" font-weight="600">ACCREDIT:</text>
    <text x="145" y="196" fill="#c084fc" font-size="11.5" font-weight="600">ADSO SENA (Software Technologist)</text>

    <!-- Spec Row 5 -->
    <text x="36" y="224" fill="#64748b" font-size="11" font-weight="600">RUNTIME:</text>
    <text x="145" y="224" fill="#e2e8f0" font-size="11.5" font-weight="600">Arch Linux • Neovim • Docker Engine</text>

    <!-- Spec Row 6: Status -->
    <text x="36" y="252" fill="#64748b" font-size="11" font-weight="600">STATUS:</text>
    <rect x="145" y="238" width="220" height="20" rx="3" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1" />
    <circle cx="157" cy="248" r="3" fill="#34d399" />
    <text x="168" y="252" fill="#34d399" font-size="10" font-weight="700" letter-spacing="0.5">READY FOR INTERNSHIP / HIRE</text>
  </g>

  <!-- Vertical Divider with Center Node -->
  <line x1="430" y1="62" x2="430" y2="260" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />

  <!-- ================= RIGHT COLUMN: TELEMETRY METERS ================= -->
  <g class="mono">
    <text x="456" y="80" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="2">📊 CAPABILITY TELEMETRY</text>

    <!-- Meter 1: Backend Architecture -->
    <text x="456" y="106" fill="#e2e8f0" font-size="11" font-weight="600">BACKEND // Spring Boot 4 • Java 21 • Flyway</text>
    <text x="898" y="106" fill="#64ffda" font-size="11" font-weight="700" text-anchor="end">96%</text>
    <rect x="456" y="114" width="444" height="7" rx="3.5" fill="#0b172a" stroke="#1e293b" stroke-width="1" />
    <rect x="456" y="114" width="426" height="7" rx="3.5" fill="url(#barCyan)" filter="url(#neonBlur)" />

    <!-- Meter 2: Frontend & Mobile -->
    <text x="456" y="146" fill="#e2e8f0" font-size="11" font-weight="600">FRONTEND // Angular 21 • TypeScript • RxJS</text>
    <text x="898" y="146" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="end">92%</text>
    <rect x="456" y="154" width="444" height="7" rx="3.5" fill="#0b172a" stroke="#1e293b" stroke-width="1" />
    <rect x="456" y="154" width="408" height="7" rx="3.5" fill="url(#barBlue)" filter="url(#neonBlur)" />

    <!-- Meter 3: Semantic AI & RAG -->
    <text x="456" y="186" fill="#e2e8f0" font-size="11" font-weight="600">AI SYSTEMS // RAG • ChromaDB • Embeddings</text>
    <text x="898" y="186" fill="#c084fc" font-size="11" font-weight="700" text-anchor="end">88%</text>
    <rect x="456" y="194" width="444" height="7" rx="3.5" fill="#0b172a" stroke="#1e293b" stroke-width="1" />
    <rect x="456" y="194" width="390" height="7" rx="3.5" fill="url(#barPurple)" filter="url(#neonBlur)" />

    <!-- Meter 4: DevOps & Testing -->
    <text x="456" y="226" fill="#e2e8f0" font-size="11" font-weight="600">OPS &amp; QA // Docker • Vitest • JUnit 5 • Linux</text>
    <text x="898" y="226" fill="#34d399" font-size="11" font-weight="700" text-anchor="end">94%</text>
    <rect x="456" y="234" width="444" height="7" rx="3.5" fill="#0b172a" stroke="#1e293b" stroke-width="1" />
    <rect x="456" y="234" width="418" height="7" rx="3.5" fill="url(#barGreen)" filter="url(#neonBlur)" />
  </g>

  <!-- ================= BOTTOM METRIC BADGES ================= -->
  <line x1="24" y1="272" x2="916" y2="272" stroke="#1e293b" stroke-width="1" />

  <g class="mono">
    <!-- Stat 1 -->
    <rect x="36" y="284" width="200" height="28" rx="4" fill="#0c192d" stroke="#1e3a5f" stroke-width="1" />
    <text x="136" y="302" fill="#64ffda" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">⚡ 11+ REPOSITORIES</text>

    <!-- Stat 2 -->
    <rect x="256" y="284" width="200" height="28" rx="4" fill="#0c192d" stroke="#1e3a5f" stroke-width="1" />
    <text x="356" y="302" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">🎯 SUB-50ms TARGET</text>

    <!-- Stat 3 -->
    <rect x="476" y="284" width="210" height="28" rx="4" fill="#0c192d" stroke="#1e3a5f" stroke-width="1" />
    <text x="581" y="302" fill="#c084fc" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">🛡️ ZERO-TRUST ARCH</text>

    <!-- Stat 4 -->
    <rect x="706" y="284" width="194" height="28" rx="4" fill="#0c192d" stroke="#1e3a5f" stroke-width="1" />
    <text x="803" y="302" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">🔬 SYSTEMIC TRACE</text>
  </g>
</svg>
